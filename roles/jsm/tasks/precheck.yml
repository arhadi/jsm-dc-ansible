---
# ------------------------------------------------------------
# Jira Service Management Data Center - Precheck
# ------------------------------------------------------------

- name: Display JSM variables
  ansible.builtin.debug:
    msg:
      - "========================================"
      - "JSM Precheck"
      - "Version           : {{ jsm_version }}"
      - "Install Method    : {{ jsm_install_method }}"
      - "Archive           : {{ jsm_archive }}"
      - "Binary Installer  : {{ jsm_installer }}"
      - "Install Directory : {{ jsm_install_dir }}"
      - "Home Directory    : {{ jsm_home_dir }}"
      - "Database          : {{ jsm_db_name }}"
      - "DB Host           : {{ jsm_db_host }}"
      - "DB Port           : {{ jsm_db_port }}"
      - "HTTP Port         : {{ jsm_http_port }}"
      - "Control Port      : {{ jsm_control_port }}"
      - "Deployment Mode   : {{ jsm_deployment_mode }}"
      - "========================================"

# ------------------------------------------------------------
# Operating System
# ------------------------------------------------------------

- name: Check operating system
  ansible.builtin.assert:
    that:
      - ansible_distribution == "RedHat"
      - ansible_distribution_major_version | int == 9
    fail_msg: "Only RHEL 9 is supported by this automation."

# ------------------------------------------------------------
# Installation Method
# ------------------------------------------------------------

- name: Validate JSM installation method
  ansible.builtin.assert:
    that:
      - jsm_install_method in ['archive', 'installer']
    fail_msg: >
      Invalid jsm_install_method={{ jsm_install_method }}.
      Supported methods are archive and installer.

# ------------------------------------------------------------
# Archive Method
# ------------------------------------------------------------

- name: Check JSM archive
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ jsm_archive }}"
    checksum_algorithm: sha256
  register: jsm_archive_check
  when: jsm_install_method == "archive"

- name: Validate JSM archive exists
  ansible.builtin.assert:
    that:
      - jsm_archive_check.stat.exists
      - jsm_archive_check.stat.isreg
    fail_msg: >
      Missing JSM archive:
      {{ role_path }}/files/{{ jsm_archive }}
  when: jsm_install_method == "archive"

- name: Verify JSM archive SHA256 checksum
  ansible.builtin.assert:
    that:
      - jsm_archive_check.stat.checksum == jsm_archive_sha256
    success_msg: "JSM archive checksum verified successfully."
    fail_msg: >
      JSM archive checksum verification FAILED.

      File:
      {{ role_path }}/files/{{ jsm_archive }}

      Expected:
      {{ jsm_archive_sha256 }}

      Actual:
      {{ jsm_archive_check.stat.checksum }}
  when:
    - jsm_install_method == "archive"
    - jsm_archive_sha256 | length > 0

# ------------------------------------------------------------
# Binary Installer Method
# ------------------------------------------------------------

- name: Check JSM binary installer
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ jsm_installer }}"
    checksum_algorithm: sha256
  register: jsm_installer_check
  when: jsm_install_method == "installer"

- name: Validate JSM binary installer exists
  ansible.builtin.assert:
    that:
      - jsm_installer_check.stat.exists
      - jsm_installer_check.stat.isreg
    fail_msg: >
      Missing JSM binary installer:
      {{ role_path }}/files/{{ jsm_installer }}
  when: jsm_install_method == "installer"

- name: Verify JSM binary installer SHA256 checksum
  ansible.builtin.assert:
    that:
      - jsm_installer_check.stat.checksum == jsm_installer_sha256
    success_msg: "JSM binary installer checksum verified successfully."
    fail_msg: >
      JSM binary installer checksum verification FAILED.

      File:
      {{ role_path }}/files/{{ jsm_installer }}

      Expected:
      {{ jsm_installer_sha256 }}

      Actual:
      {{ jsm_installer_check.stat.checksum }}
  when:
    - jsm_install_method == "installer"
    - jsm_installer_sha256 | length > 0

# ------------------------------------------------------------
# Java
# ------------------------------------------------------------

- name: Check Java installation
  ansible.builtin.command:
    cmd: java -version
  register: java_check
  changed_when: false
  failed_when: false

- name: Fail if Java is not installed
  ansible.builtin.assert:
    that:
      - java_check.rc == 0
    fail_msg: "Java is not installed or java is not available in PATH."

- name: Detect Java home
  ansible.builtin.shell: |
    dirname $(dirname $(readlink -f $(which java)))
  register: detected_java_home
  changed_when: false

- name: Set detected JAVA_HOME
  ansible.builtin.set_fact:
    java_home: "{{ detected_java_home.stdout }}"

- name: Validate Java home is JDK
  ansible.builtin.stat:
    path: "{{ java_home }}/bin/javac"
  register: java_compiler

- name: Fail if JDK is missing
  ansible.builtin.assert:
    that:
      - java_compiler.stat.exists
    fail_msg: "JAVA_HOME does not point to a JDK: {{ java_home }}"

- name: Display Java version
  ansible.builtin.debug:
    var: java_check.stderr_lines

- name: Display detected JAVA_HOME
  ansible.builtin.debug:
    msg: "JAVA_HOME: {{ java_home }}"

# ------------------------------------------------------------
# Disk Space
# ------------------------------------------------------------

- name: Check available disk space
  ansible.builtin.shell: |
    df -BG "{{ jsm_base_dir }}" | tail -1 | awk '{print $4}' | sed 's/G//'
  register: jsm_disk
  changed_when: false

- name: Validate disk space
  ansible.builtin.assert:
    that:
      - jsm_disk.stdout | int >= 10
    fail_msg: >
      Insufficient disk space on {{ jsm_base_dir }}.
      Available: {{ jsm_disk.stdout }} GB
      Required: at least 10 GB.

# ------------------------------------------------------------
# PostgreSQL
# ------------------------------------------------------------

- name: Test PostgreSQL connectivity
  ansible.builtin.wait_for:
    host: "{{ jsm_db_host }}"
    port: "{{ jsm_db_port }}"
    timeout: 10

- name: PostgreSQL connectivity result
  ansible.builtin.debug:
    msg:
      - "PostgreSQL reachable"
      - "Host: {{ jsm_db_host }}"
      - "Port: {{ jsm_db_port }}"

# ------------------------------------------------------------
# Port Validation
#
# Only fail when there is no existing JSM installation.
# This permits idempotent re-runs against an installed system.
# ------------------------------------------------------------

- name: Check existing JSM installation
  ansible.builtin.stat:
    path: "{{ jsm_install_dir }}/bin/start-jira.sh"
  register: jsm_existing_install

- name: Check JSM HTTP port
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ jsm_http_port }}"
    state: stopped
    timeout: 2
  when: not jsm_existing_install.stat.exists

- name: Check JSM control port
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ jsm_control_port }}"
    state: stopped
    timeout: 2
  when: not jsm_existing_install.stat.exists

# ------------------------------------------------------------
# Precheck Summary
# ------------------------------------------------------------

- name: JSM precheck summary
  ansible.builtin.debug:
    msg:
      - "========================================"
      - "JSM precheck completed successfully"
      - "Version        : {{ jsm_version }}"
      - "Method         : {{ jsm_install_method }}"
      - "Java Home      : {{ java_home }}"
      - "Database       : {{ jsm_db_host }}:{{ jsm_db_port }}/{{ jsm_db_name }}"
      - "HTTP Port      : {{ jsm_http_port }}"
      - "Control Port   : {{ jsm_control_port }}"
      - "Deployment     : {{ jsm_deployment_mode }}"
      - "========================================"
