---
###############################################################################
# Jira Service Management Data Center - Validation
###############################################################################

###############################################################################
# Installation
###############################################################################

- name: Verify JSM installation directory
  ansible.builtin.stat:
    path: "{{ jsm_install_dir }}"
  register: jsm_install

- name: Verify JSM startup script
  ansible.builtin.stat:
    path: "{{ jsm_start_script }}"
  register: jsm_start

- name: Verify JSM shutdown script
  ansible.builtin.stat:
    path: "{{ jsm_stop_script }}"
  register: jsm_stop

###############################################################################
# PostgreSQL JDBC Driver
###############################################################################

- name: Verify PostgreSQL JDBC driver
  ansible.builtin.stat:
    path: "{{ jsm_install_dir }}/lib/{{ jsm_db_jdbc_jar }}"
  register: jsm_jdbc_driver

###############################################################################
# JSM Home
###############################################################################

- name: Verify JSM home directory
  ansible.builtin.stat:
    path: "{{ jsm_home_dir }}"
  register: jsm_home

- name: Verify dbconfig.xml
  ansible.builtin.stat:
    path: "{{ jsm_home_dir }}/dbconfig.xml"
  register: jsm_dbconfig

- name: Verify cluster.properties
  ansible.builtin.stat:
    path: "{{ jsm_home_dir }}/cluster.properties"
  register: jsm_cluster
  when: jsm_deployment_mode == "cluster"

###############################################################################
# Shared Home
###############################################################################

- name: Verify JSM shared home
  ansible.builtin.stat:
    path: "{{ jsm_shared_dir }}"
  register: jsm_shared_home
  when: jsm_deployment_mode == "cluster"

- name: Validate JSM shared home
  ansible.builtin.assert:
    that:
      - jsm_shared_home.stat.exists
      - jsm_shared_home.stat.isdir
    fail_msg: "JSM shared home {{ jsm_shared_dir }} does not exist."
  when: jsm_deployment_mode == "cluster"

###############################################################################
# Database Connectivity
###############################################################################

- name: Verify PostgreSQL TCP connectivity
  ansible.builtin.wait_for:
    host: "{{ jsm_db_host }}"
    port: "{{ jsm_db_port }}"
    timeout: 5

###############################################################################
# systemd Service
###############################################################################

- name: Verify JSM systemd service file
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ jsm_service_name }}.service"
  register: jsm_service_file

- name: Check JSM service status
  ansible.builtin.command:
    cmd: "systemctl is-active {{ jsm_service_name }}"
  register: jsm_service_status
  changed_when: false
  failed_when: false

- name: Verify JSM service is running
  ansible.builtin.assert:
    that:
      - jsm_service_status.stdout == "active"
    fail_msg: "JSM service {{ jsm_service_name }} is not running."
  when: jsm_service_started | bool

###############################################################################
# Java Process
###############################################################################

- name: Check JSM Java process
  ansible.builtin.shell: >
    ps -ef | grep '[j]ava' | grep "{{ jsm_install_dir }}"
  register: jsm_java_process
  changed_when: false
  failed_when: false

- name: Verify JSM Java process
  ansible.builtin.assert:
    that:
      - jsm_java_process.rc == 0
    fail_msg: "JSM Java process is not running."
  when: jsm_service_started | bool

###############################################################################
# PID
###############################################################################

- name: Verify JSM PID file
  ansible.builtin.stat:
    path: "{{ jsm_pid_file }}"
  register: jsm_pid

###############################################################################
# HTTP Validation
###############################################################################

- name: Wait for JSM HTTP port
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ jsm_http_port }}"
    delay: 5
    timeout: "{{ jsm_start_timeout }}"
  when: jsm_service_started | bool

- name: Wait for JSM HTTP endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jsm_http_port }}{{ jsm_context_path }}/"
    method: GET
    follow_redirects: none
    status_code:
      - 200
      - 302
      - 303
    return_content: false
  register: jsm_http
  retries: 60
  delay: 5
  until: jsm_http.status | default(0) in [200, 302, 303]
  when: jsm_service_started | bool

- name: Verify JSM HTTP response
  ansible.builtin.assert:
    that:
      - jsm_http.status in [200, 302, 303]
    fail_msg: "JSM HTTP endpoint is unavailable."
  when: jsm_service_started | bool

###############################################################################
# Java
###############################################################################

- name: Verify Java version
  ansible.builtin.command:
    cmd: "{{ java_home }}/bin/java -version"
  register: jsm_java_version
  changed_when: false

###############################################################################
# Ownership
###############################################################################

- name: Get JSM installation ownership
  ansible.builtin.stat:
    path: "{{ jsm_install_dir }}"
  register: jsm_install_owner

- name: Verify JSM installation ownership
  ansible.builtin.assert:
    that:
      - jsm_install_owner.stat.pw_name == jsm_user
      - jsm_install_owner.stat.gr_name == jsm_group
    fail_msg: "Incorrect ownership on {{ jsm_install_dir }}."

###############################################################################
# Logs
###############################################################################

- name: Verify JSM logs directory
  ansible.builtin.stat:
    path: "{{ jsm_log_dir }}"
  register: jsm_logs

- name: Validate JSM logs directory
  ansible.builtin.assert:
    that:
      - jsm_logs.stat.exists
      - jsm_logs.stat.isdir
    fail_msg: "JSM logs directory {{ jsm_log_dir }} is missing."

###############################################################################
# Cluster
###############################################################################

- name: Verify JSM cluster node ID
  ansible.builtin.command:
    cmd: "grep -F 'jira.node.id={{ jsm_node_id }}' {{ jsm_home_dir }}/cluster.properties"
  changed_when: false
  when: jsm_deployment_mode == "cluster"

###############################################################################
# Final Validation
###############################################################################

- name: Ensure JSM installation is complete
  ansible.builtin.assert:
    that:
      - jsm_install.stat.exists
      - jsm_install.stat.isdir
      - jsm_home.stat.exists
      - jsm_home.stat.isdir
      - jsm_start.stat.exists
      - jsm_stop.stat.exists
      - jsm_dbconfig.stat.exists
      - jsm_service_file.stat.exists
      - jsm_jdbc_driver.stat.exists
      - jsm_logs.stat.exists
      - not jsm_service_started or jsm_pid.stat.exists
      - not jsm_service_started or jsm_java_process.rc == 0
      - not jsm_service_started or jsm_service_status.stdout == "active"
      - jsm_deployment_mode != "cluster" or jsm_cluster.stat.exists
      - jsm_deployment_mode != "cluster" or jsm_shared_home.stat.exists
    fail_msg: "Jira Service Management installation validation failed."
    success_msg: "Jira Service Management installation validation completed successfully."

###############################################################################
# Validation Summary
###############################################################################

- name: JSM validation summary
  ansible.builtin.debug:
    msg:
      - "========================================"
      - "JSM validation completed"
      - "Version           : {{ jsm_version }}"
      - "Install Directory : {{ jsm_install_dir }}"
      - "Home Directory    : {{ jsm_home_dir }}"
      - "Shared Directory  : {{ jsm_shared_dir if jsm_deployment_mode == 'cluster' else 'N/A' }}"
      - "HTTP Port         : {{ jsm_http_port }}"
      - "Database          : {{ jsm_db_name }}"
      - "Database User     : {{ jsm_db_username }}"
      - "Database Host     : {{ jsm_db_host }}:{{ jsm_db_port }}"
      - "Service           : {{ jsm_service_name }}"
      - "Deployment Mode   : {{ jsm_deployment_mode }}"
      - "========================================"

###############################################################################
# Next Steps
###############################################################################

- name: Display JSM next steps
  ansible.builtin.debug:
    msg:
      - ""
      - "======================================================="
      - "Jira Service Management Data Center installation complete"
      - "======================================================="
      - ""
      - "Installation Details"
      - "--------------------"
      - "Version            : {{ jsm_version }}"
      - "Install Directory  : {{ jsm_install_dir }}"
      - "Home Directory     : {{ jsm_home_dir }}"
      - "Service            : {{ jsm_service_name }}"
      - "HTTP Port          : {{ jsm_http_port }}"
      - "Database           : {{ jsm_db_name }}"
      - "Java Home          : {{ java_home }}"
      - "Cluster Mode       : {{ jsm_deployment_mode }}"
      - ""
      - "Access URL"
      - "----------"
      - "http://{{ ansible_default_ipv4.address | default(inventory_hostname) }}:{{ jsm_http_port }}{{ jsm_context_path }}"
      - ""
      - "Useful Commands"
      - "---------------"
      - "systemctl status {{ jsm_service_name }}"
      - "systemctl restart {{ jsm_service_name }}"
      - "journalctl -u {{ jsm_service_name }} -f"
      - ""
      - "======================================================="
