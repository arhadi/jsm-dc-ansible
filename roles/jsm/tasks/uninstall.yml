---
###############################################################################
# Stop JSM
###############################################################################

- name: Check if JSM service exists
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ jsm_service_name }}.service"
  register: jsm_service

- name: Stop JSM service
  ansible.builtin.systemd:
    name: "{{ jsm_service_name }}"
    state: stopped
  when: jsm_service.stat.exists
  ignore_errors: true

- name: Disable JSM service
  ansible.builtin.systemd:
    name: "{{ jsm_service_name }}"
    enabled: false
  when: jsm_service.stat.exists
  ignore_errors: true

###############################################################################
# Remove systemd
###############################################################################

- name: Remove JSM systemd service
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ jsm_service_name }}.service"
    state: absent

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

###############################################################################
# Remove Installation
###############################################################################

- name: Remove JSM installation directory
  ansible.builtin.file:
    path: "{{ jsm_install_dir }}"
    state: absent

###############################################################################
# Remove JSM Home
###############################################################################

- name: Remove JSM Home
  ansible.builtin.file:
    path: "{{ jsm_home_dir }}"
    state: absent
  when: jsm_remove_home

###############################################################################
# Remove Shared Home
###############################################################################

- name: Remove JSM Shared Home
  ansible.builtin.file:
    path: "{{ jsm_shared_dir }}"
    state: absent
  when:
    - jsm_deployment_mode == "cluster"
    - jsm_remove_shared_home

###############################################################################
# Remove User
###############################################################################

- name: Remove JSM user
  ansible.builtin.user:
    name: "{{ jsm_user }}"
    state: absent
    remove: true
  when: jsm_remove_user

###############################################################################
# Remove Group
###############################################################################

- name: Remove JSM group
  ansible.builtin.group:
    name: "{{ jsm_group }}"
    state: absent
  when: jsm_remove_group

###############################################################################
# Cleanup
###############################################################################

- name: Remove temporary installer
  ansible.builtin.file:
    path: "{{ jsm_temp_dir }}/{{ jsm_archive }}"
    state: absent

###############################################################################
# Validation
###############################################################################

- name: Verify JSM installation directory removed
  ansible.builtin.stat:
    path: "{{ jsm_install_dir }}"
  register: jsm_install

- name: Verify Jira home removed
  ansible.builtin.stat:
    path: "{{ jsm_home_dir }}"
  register: jsm_home

- name: Verify systemd service removed
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ jsm_service_name }}.service"
  register: jsm_systemd

- name: Fail if uninstall incomplete
  ansible.builtin.fail:
    msg: "JSM uninstall is incomplete."
  when:
    - jsm_install.stat.exists
      or jsm_home.stat.exists
      or jsm_systemd.stat.exists

- name: Uninstall completed
  ansible.builtin.debug:
    msg:
      - "JSM has been removed successfully."
      - "Installer archive under files/ has been preserved."
